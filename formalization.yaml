# The metadata of this formalization. The keys follow the formalization.yaml schema of version 0.4 that resolutionorg/hironaka uses. The relationships bridges and audits are new keys that this project asks the maintainers of the schema to add (spec 14.6, Q-14).
version: "0.4"
project:
  name: mmp-lean
  description: Statements in Lean 4 of the minimal model program of birational geometry, the proofs of its known parts, an audit of the 4-fold termination claim of AxiomMath/MMP, and the work on its open parts.
  authors:
    - The mmp authors
  responsible_maintainers:
    - tamnd
  license: Apache-2.0
sources:
  - title: Birational geometry of algebraic varieties
    authors: [Janos Kollar, Shigefumi Mori]
    id: "mmp:KM98"
    type: book
    location: Cambridge Tracts in Mathematics 134, Cambridge University Press (1998)
    relationship: background
    note: The source of the definitions of the pair classes, the cone theorem (Theorem 3.7), the minimal models (Definition 3.50) and the program. The reader role checks each theorem number against the book before a node depends on it (Q-11).
    author_endorsement: false
  - title: Existence of minimal models for varieties of log general type
    authors: [Caucher Birkar, Paolo Cascini, Christopher D. Hacon, James McKernan]
    id: "mmp:BCHM10"
    type: paper
    location: Journal of the American Mathematical Society 23 (2010), 405-468
    relationship: background
    note: The source of statements S30 (the existence of klt flips) and S32 (the finite generation of the canonical ring).
    author_endorsement: false
  - title: Algebraic geometry
    authors: [Robin Hartshorne]
    id: "mmp:Har77"
    type: book
    location: Graduate Texts in Mathematics 52, Springer (1977)
    relationship: background
    note: The source of Castelnuovo's contraction theorem, Theorem V.5.7, statement S10.
    author_endorsement: false
  - title: Letters of a bi-rationalist V. Minimal log discrepancies and termination of log flips
    authors: [Vyacheslav V. Shokurov]
    id: "mmp:Sho04"
    type: paper
    location: Proceedings of the Steklov Institute of Mathematics 246 (2004), 315-336
    relationship: background
    note: The source of statement S28, the reduction of the termination of flips to the ACC and the lower semicontinuity of minimal log discrepancies, and of the abstract Shokurov lemma O-R4-1. The pinned statement of the lemma is in MinimalModel/Statements/Shokurov.lean.
    author_endorsement: false
  - title: Fundamental theorems for the log minimal model program
    authors: [Osamu Fujino]
    id: "mmp:Fuj11"
    type: paper
    location: arXiv:0909.4445
    relationship: background
    note: The source of statement S05, the cone theorem for lc pairs.
    author_endorsement: false
  - title: Existence of log canonical flips and a special LMMP
    authors: [Caucher Birkar]
    id: "mmp:Bir12"
    type: paper
    location: arXiv:1104.4981
    relationship: background
    note: A source of statement S26, the existence of lc flips.
    author_endorsement: false
  - title: Existence of log canonical closures
    authors: [Christopher D. Hacon, Chenyang Xu]
    id: "mmp:HX13"
    type: paper
    location: arXiv:1105.1169
    relationship: background
    note: A source of statement S26, the existence of lc flips.
    author_endorsement: false
  - title: Flip theorem and the existence of minimal models for 3-folds
    authors: [Shigefumi Mori]
    id: "mmp:Mor88"
    type: paper
    location: Journal of the American Mathematical Society 1 (1988), 117-253
    relationship: background
    note: A source of statement S15, the existence of 3-fold flips.
    author_endorsement: false
  - title: Termination of log flips for algebraic 3-folds
    authors: [Yujiro Kawamata]
    id: "mmp:Kaw92"
    type: paper
    location: International Journal of Mathematics 3 (1992), 653-659
    relationship: background
    note: The source of statement S16, the termination of 3-fold lc flips.
    author_endorsement: false
  - title: Termination of pseudo-effective 4-fold flips
    authors: [Joaquín Moraga]
    id: "mmp:Mor25"
    type: paper
    location: arXiv:1802.10202
    relationship: background
    note: The source of statement S21, the termination of flips for pseudo-effective lc 4-folds.
    author_endorsement: false
  - title: Toric varieties
    authors: [David A. Cox, John B. Little, Henry K. Schenck]
    id: "mmp:CLS11"
    type: book
    location: Graduate Studies in Mathematics 124, American Mathematical Society (2011)
    relationship: background
    note: The source of the definitions of cones and fans in MinimalModel/Toric/Fan.lean.
    author_endorsement: false
  - title: Decomposition of toric morphisms
    authors: [Miles Reid]
    id: "mmp:Rei83"
    type: paper
    location: Arithmetic and Geometry, Vol. II, Progress in Mathematics 36, Birkhauser (1983), 395-418
    relationship: background
    note: The source of the toric cone theorem, with CLS11 Theorem 6.3.12. The pinned statement is in MinimalModel/Statements/Toric.lean.
    author_endorsement: false
  - title: On termination of flips and exceptionally non-canonical singularities
    authors: [Jingjun Han, Jihao Liu]
    id: "mmp:HL25"
    type: paper
    location: Geometry and Topology 29 (2025), arXiv:2209.13122
    relationship: background
    note: The source of the enc pairs (Definition 3.8) and of statement S52 (Conjecture 1.9(2')).
    author_endorsement: false
  - title: On effective non-vanishing and base-point-freeness
    authors: [Yujiro Kawamata]
    id: "mmp:Kaw00"
    type: paper
    location: Asian Journal of Mathematics 4 (2000)
    relationship: background
    note: The source of the effective non-vanishing conjecture, whose negation in dimension 4 is statement S57. The reader role checks the number of the conjecture.
    author_endorsement: false
  - title: Counterexamples to the effective non-vanishing conjecture
    authors: [Ajit]
    id: "mmp:Ajit26"
    type: paper
    location: arXiv:2610.09270 v2
    relationship: background
    note: The claimed counterexamples in dimension 4 that statement S57 records. The claim is not refereed. The title here is descriptive, and the reader role copies the title of the source.
    author_endorsement: false
  - title: Higher direct images of dualizing sheaves I
    authors: [Janos Kollar]
    id: "mmp:Kol86"
    type: paper
    location: Annals of Mathematics 123 (1986)
    relationship: background
    note: The source of statement S03, the injectivity theorem (Theorem 2.2) and the torsion-freeness theorem (Theorem 2.1). The statement follows the forms of Fujino, arXiv:0704.0073 Theorem 1.1 and Fuj11 3.4(i). The reader role checks the theorem numbers against the paper.
    author_endorsement: false
  - title: Mori dream spaces and GIT
    authors: [Yi Hu, Sean Keel]
    id: "mmp:HK00"
    type: paper
    location: Michigan Mathematical Journal 48 (2000), arXiv:math/0004017
    relationship: background
    note: The source of the definition of a Mori dream space (Definition 1.10), which statement S37 uses.
    author_endorsement: false
  - title: Singularities of linear systems and boundedness of Fano varieties
    authors: [Caucher Birkar]
    id: "mmp:Bir21"
    type: paper
    location: Annals of Mathematics 193 (2021), arXiv:1609.05543
    relationship: background
    note: The source of statement S53 (Theorem 1.1) and of the bounded families (2.8) and the epsilon-lc pairs (2.2) that it uses.
    author_endorsement: false
  - title: The cone conjecture for Calabi-Yau pairs in dimension two
    authors: [Burt Totaro]
    id: "mmp:Tot10"
    type: paper
    location: Duke Mathematical Journal 154 (2010), arXiv:0901.3361
    relationship: background
    note: The source of the form of the cone conjecture (Conjecture 1.1) that statement S55 states, with the base a point.
    author_endorsement: false
  - title: The Sarkisov program
    authors: [Christopher D. Hacon, James McKernan]
    id: "mmp:HM13"
    type: paper
    location: Journal of Algebraic Geometry 22 (2013), arXiv:0905.0946
    relationship: background
    note: The source of statement S36 (Theorem 1.3, with Theorem 1.1 as a consequence) and of the Sarkisov links of types I to IV (Section 1) that it uses.
    author_endorsement: false
  - title: Existence of the minimal model program for log canonical generalized pairs
    authors: [Zhengyu Hu, Jihao Liu]
    id: "mmp:HuL26"
    type: paper
    location: arXiv:2603.03817 v1
    relationship: background
    note: The source of statement S27 (Theorem 1.1) and of the generalized pairs (Definitions 2.5, 2.7 and 2.9) that it uses. The claim is not refereed.
    author_endorsement: false
  - title: AxiomMath/MMP
    authors: [AxiomMath]
    id: "mmp:AxiomMMP"
    type: formalization
    location: https://github.com/AxiomMath/MMP at commit 1f9ade3670
    relationship: audits
    note: The Lean project that claims the termination of the minimal model program for lc 4-folds with a rational boundary. Statement S22 is the statement of this project for the same claim. The audit steps A1 to A8 of spec 04 read the definitions and the proofs of this commit. S22 stays claimed until the audit closes with Q9 yes.
    author_endorsement: false
  - title: AxiomMath/MMP, the bridge
    authors: [AxiomMath]
    id: "mmp:AxiomMMPBridge"
    type: formalization
    location: https://github.com/AxiomMath/MMP at commit 1f9ade3670
    relationship: bridges
    note: The package MinimalModelBridge in bridge/ will prove that the statements of this project agree with the statements of AxiomMath/MMP where both apply. At S0 the bridge has no proof yet.
    author_endorsement: false
classification:
  arxiv: [math.AG]
  msc2020: [14E30, 14E05, 14J17, 14M25, 03B35]
status:
  scope: statements
  sorry_count: 0
  sorry_in_definitions: false
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - name: MinimalModel.ConeTheoremKlt
      kind: statement
      status: known
      note: S04, the cone theorem for projective klt pairs, KM98 Theorem 3.7 parts 1 and 2. This is a definition of a proposition. It is not proved in this package.
    - name: MinimalModel.Castelnuovo
      kind: statement
      status: known
      note: S10, Castelnuovo's contraction theorem, Hartshorne V.5.7.
    - name: MinimalModel.SurfaceConeTheorem
      kind: statement
      status: known
      note: S11, the cone theorem for smooth projective surfaces.
    - name: MinimalModel.SurfaceMMP
      kind: statement
      status: known
      note: S12, the minimal model program for smooth projective surfaces.
    - name: MinimalModel.Termination
      kind: statement
      status: open
      note: S20, the termination of flips for projective lc pairs of dimension n. It is open for n at least 4.
    - name: MinimalModel.TerminationLc4Rational
      kind: statement
      status: claimed
      note: S22, the termination of the program for projective lc 4-folds with a rational boundary, the claim of AxiomMath/MMP. It is never a hypothesis of another proof until the audit closes.
    - name: MinimalModel.ShokurovReduction
      kind: statement
      status: known
      note: S28, the ACC and the lower semicontinuity of minimal log discrepancies give the termination of flips.
    - name: MinimalModel.KltFlips
      kind: statement
      status: known
      note: S30, the existence of klt flips, BCHM Corollary 1.4.1.
    - name: MinimalModel.FiniteGenerationCanonical
      kind: statement
      status: known
      note: S32, the finite generation of the canonical ring of a smooth projective variety, BCHM Corollary 1.1.2.
    - name: MinimalModel.MinimalModelConj
      kind: statement
      status: open
      note: S33, the existence of minimal models for projective lc pairs with a pseudo-effective log canonical divisor. It is open for n at least 4.
    - name: MinimalModel.Abundance
      kind: statement
      status: open
      note: S40, the abundance conjecture. It is open for n at least 4.
    - name: MinimalModel.NonVanishing
      kind: statement
      status: open
      note: S41, the non-vanishing conjecture. It is open for n at least 4.
    - name: MinimalModel.ACCMld
      kind: statement
      status: open
      note: S49, the ACC conjecture for minimal log discrepancies. It is open for n at least 4.
    - name: MinimalModel.LSCMld
      kind: statement
      status: open
      note: S50, the lower semicontinuity conjecture for minimal log discrepancies. It is open for n at least 4.
    - name: MinimalModel.ConeTheoremLc
      kind: statement
      status: known
      note: S05, the cone theorem for projective lc pairs (Fujino).
    - name: MinimalModel.RationalityTheorem
      kind: statement
      status: known
      note: S07, the rationality theorem, KM98 Theorem 3.5, with an ample H.
    - name: MinimalModel.BasepointFree
      kind: statement
      status: known
      note: S08, the base point free theorem, KM98 Theorem 3.3.
    - name: MinimalModel.LcSurfaceMMP
      kind: statement
      status: known
      note: S13, each program for a projective lc surface pair runs and ends (Fujino).
    - name: MinimalModel.ThreefoldFlips
      kind: statement
      status: known
      note: S15, the existence of flips for projective Q-factorial klt 3-folds (Mori, Shokurov).
    - name: MinimalModel.ThreefoldTermination
      kind: statement
      status: known
      note: S16, the termination of flips for projective lc 3-folds, T(3).
    - name: MinimalModel.ThreefoldLcMMP
      kind: statement
      status: known
      note: S18, each program for a projective lc 3-fold runs and ends.
    - name: MinimalModel.SpecialTermination
      kind: statement
      status: known
      note: S19, a reduction. Termination below dimension n gives special termination for Q-factorial dlt pairs of dimension n.
    - name: MinimalModel.TerminationPseffLc4
      kind: statement
      status: known
      note: S21, the termination of flips for projective lc 4-folds with a pseudo-effective log canonical divisor (Moraga; Chen and Tsakanikas).
    - name: MinimalModel.TerminationScalingBig
      kind: statement
      status: known
      note: S23, the termination of each program with scaling for a Q-factorial klt pair with a big boundary, BCHM Corollary 1.4.2.
    - name: MinimalModel.TerminationBigLe5
      kind: statement
      status: claimed
      note: S24, the termination of each program for klt pairs of dimension at most 5 with a big boundary or a big log canonical divisor (Han, Liu and Zhuang). It is never a hypothesis of another proof.
    - name: MinimalModel.TerminationBig
      kind: statement
      status: claimed
      note: S25, the statement of S24 in each dimension (Hashizume). It is never a hypothesis of another proof.
    - name: MinimalModel.LcFlips
      kind: statement
      status: known
      note: S26, the existence of lc flips (Birkar; Hacon and Xu).
    - name: MinimalModel.GeneralizedLcFlips
      kind: statement
      status: claimed
      note: S27, the existence of flips for lc generalized pairs (Hu and Liu, arXiv:2603.03817, Theorem 1.1), with the base a point. It is never a hypothesis of another proof.
    - name: MinimalModel.MoriFibreSpaceOutput
      kind: statement
      status: known
      note: S35, a program for a Q-factorial klt pair with a log canonical divisor that is not pseudo-effective ends with a Mori fibre space, BCHM Corollary 1.3.2.
    - name: MinimalModel.AbundanceBig
      kind: statement
      status: known
      note: S42, abundance for klt pairs with a nef and big log canonical divisor.
    - name: MinimalModel.LiuXuReduction
      kind: statement
      status: known
      note: S44, a reduction. Non-vanishing in dimension d gives abundance in dimension d for numerical dimension at most one (Liu and Xu).
    - name: MinimalModel.ACCLct
      kind: statement
      status: known
      note: S48, the ACC for log canonical thresholds (Hacon, McKernan and Xu).
    - name: MinimalModel.MldBound
      kind: statement
      status: open
      note: S51, the mld bound of Shokurov. The mld at a closed point is at most the dimension, with equality only at a smooth point outside the boundary.
    - name: MinimalModel.SurfaceAbundance
      kind: statement
      status: known
      note: S14, abundance for projective lc surface pairs (Fujino 2012, Theorem 8.1).
    - name: MinimalModel.ThreefoldAbundance
      kind: statement
      status: known
      note: S17, abundance for projective lc 3-folds with a rational boundary (Miyaoka, Kawamata, Keel, Matsuki and McKernan).
    - name: MinimalModel.HanLiuReduction
      kind: statement
      status: known
      note: S29, a reduction. The ACC for the global mlds of enc pairs and the termination of Q-factorial terminal flips in dimension d give the termination of lc flips in each dimension at most d (Han and Liu, Theorem 1.1).
    - name: MinimalModel.BCHM
      kind: statement
      status: known
      note: S31, BCHM Theorem 1.2. A klt pair over a quasi-projective base, with a big boundary and a pseudo-effective log canonical divisor or with a big log canonical divisor, has a log terminal model, an lc model in the big case, and a finitely generated log canonical ring.
    - name: MinimalModel.FinitenessOfModels
      kind: statement
      status: known
      note: S34, BCHM Theorem E. For a klt variety projective over a quasi-projective base, a rational affine space V of divisors and a general ample Q-divisor A over the base, finitely many birational maps give all the weak log canonical models of the boundaries in L_A(V). The field is uncountable, so that very general members exist.
    - name: MinimalModel.ToricMMP
      kind: statement
      status: known
      note: S39, each toric program of a complete simplicial projective fan and a rational divisor ends with a minimal model or a Mori fibre space.
    - name: MinimalModel.AbundanceNuZero
      kind: statement
      status: known
      note: S43, abundance for projective lc pairs with a nef log canonical divisor of numerical dimension zero (Nakayama, Gongyo).
    - name: MinimalModel.GeneralizedAbundance
      kind: statement
      status: open
      note: S45, the generalised abundance conjecture of Lazic and Peternell in dimension n, for a rational boundary, a nef Cartier divisor L and a semiample Q-divisor.
    - name: MinimalModel.IitakaConj
      kind: statement
      status: open
      note: S46, the Iitaka conjecture C(n, m).
    - name: MinimalModel.IndexConj
      kind: statement
      status: open
      note: S54, the index conjecture for klt log Calabi-Yau pairs with coefficients in a finite set of rational numbers.
    - name: MinimalModel.KollarTorsionFree
      kind: statement
      status: known
      note: S03, Kollar's injectivity theorem (Kollar 1986 Theorem 2.2, as in Fujino arXiv:0704.0073 Theorem 1.1) and torsion-freeness theorem (Kollar 1986 Theorem 2.1(i), as in Fujino 2011 3.4(i) with M = 0). The two parts are KollarInjectivity and KollarTorsionFreeness.
    - name: MinimalModel.cohomMap_id
      kind: theorem
      status: proved
      note: Check F3 for S03. The identity of a divisorial sheaf gives the identity on cohomology, and mulSectionsHom_apply shows that the map of S03 is multiplication by the rational function.
    - name: MinimalModel.Sarkisov
      kind: statement
      status: known
      note: S36, Hacon-McKernan Theorem 1.3. Two Mori fibre spaces that are outcomes of runs of the minimal model program from one projective Q-factorial klt pair are joined by a sequence of Sarkisov links of types I, II, III, IVm and IVs, which induces the birational map between them.
    - name: MinimalModel.FanoTypeMDS
      kind: statement
      status: known
      note: S37, BCHM Corollary 1.3.1 in the absolute case. A projective Q-factorial variety with a dlt pair whose anti log canonical divisor is ample is a Mori dream space in the sense of Hu-Keel Definition 1.10.
    - name: MinimalModel.BAB
      kind: statement
      status: known
      note: S53, Birkar Theorem 1.1. For each dimension d and each epsilon > 0, the projective varieties with an epsilon-lc pair whose anti log canonical divisor is nef and big form a bounded family in the sense of Birkar 2.8.
    - name: MinimalModel.ConeConj
      kind: statement
      status: open
      note: S55, the cone conjecture of Kawamata and Morrison for klt Calabi-Yau pairs, Totaro Conjecture 1.1 with the base a point. Aut(X, Delta) has a rational polyhedral fundamental domain on the effective nef cone, and PsAut(X, Delta) has one on the effective movable cone.
    - name: MinimalModel.isEpsLc_zero_iff
      kind: theorem
      status: proved
      note: Check F3 for S53. A 0-lc pair is lc, IsEpsLc.mono weakens epsilon, and IsEpsLc.isKlt shows that an epsilon-lc pair with epsilon > 0 is klt.
    - name: MinimalModel.numClass_zero
      kind: theorem
      status: proved
      note: Check F3 for S37 and S55. The class of the zero divisor is zero, and the zero class is in the moving cone (zero_mem_movingCone) and in the effective cone (zero_mem_effCone).
    - name: MinimalModel.SarkisovChain.self
      kind: theorem
      status: proved
      note: Check F3 for S36. Each Mori fibre space is related to itself by the empty sequence of links (sarkisov_refl gives the conclusion of S36 for the run with no step). A Mori fibre space of Sarkisov.lean satisfies IsMoriFibreSpace and has positive dimension, a sequence of links gives a birational map, the contraction of a flop contracts a curve, and a divisorial contraction has an exceptional prime divisor.
    - name: MinimalModel.pointGenPair_isGenLc
      kind: theorem
      status: proved
      note: Check F2 for S27. The generalized pair (Spec k, 0, 0) is lc, and its nef part is the same b-divisor as itself (pointNefPart_sameBDivisor).
    - name: MinimalModel.logDiscrepancyOfIs_iff
      kind: theorem
      status: proved
      note: Check F3 for S27. With the boundary of a pair, the log discrepancy of GeneralizedPairs.lean is the log discrepancy of the pair. A generalized pair with M_X = 0 gives a pair (GenPair.toPair), and the pullback of the zero divisor is zero (isRPullback_zero).
    - name: MinimalModel.FujitaFreeness
      kind: statement
      status: open
      note: S56, Fujita's freeness conjecture. The full conjecture is claimed by OpenAI 038 and is not refereed.
    - name: MinimalModel.KleimanCriterion
      kind: statement
      status: known
      note: S01, Kleiman's criterion, KM98 Theorem 1.18. An R-Cartier divisor on a projective variety is ample exactly when it is positive on the nonzero classes of the closed cone of curves.
    - name: MinimalModel.KawamataViehweg
      kind: statement
      status: known
      note: S02, Kawamata-Viehweg vanishing, KM98 Theorem 2.70, for a projective morphism and Q-divisors. The higher direct images are the sheaf cohomology of Mathlib on the inverse images of the affine open sets.
    - name: MinimalModel.ContractionTheorem
      kind: statement
      status: known
      note: S06, the contraction theorem, KM98 Theorem 3.7 parts 3 and 4. The contraction of a negative extremal face exists and is unique, and a Cartier divisor that is zero on the face is locally trivial over the target.
    - name: MinimalModel.LengthOfExtremalRays
      kind: statement
      status: known
      note: S09, the length of extremal rays, KM98 Theorem 3.7(1). Each negative extremal ray is spanned by a rational curve C with 0 < -(K+Δ)·C ≤ 2 dim X.
    - name: MinimalModel.NotEffectiveNonVanishing4
      kind: statement
      status: claimed
      note: S57, the negation of effective non-vanishing in dimension 4 (Ajit, arXiv:2610.09270, not refereed). No statement takes it as a hypothesis.
    - name: MinimalModel.HanLiuEncACC
      kind: statement
      status: open
      note: S52, Han-Liu Conjecture 1.9(2') in dimension 4. The global mlds of enc pairs with coefficients in a finite set satisfy the ACC.
    - name: MinimalModel.IsKlt.isLc
      kind: theorem
      status: proved
      note: Check F3. A klt pair is lc.
    - name: MinimalModel.exists_finite_program
      kind: theorem
      status: proved
      note: Check F3. Each model has a program of length zero, so the termination statements are about every program.
    - name: MinimalModel.TerminationLc4Rational.noInfiniteFlips
      kind: theorem
      status: proved
      note: Check F3. S22 gives the termination of flips for the 4-folds of its class.
    - name: MinimalModel.nonempty_pairModel
      kind: theorem
      status: proved
      note: Check F2. The point Spec k is a pair model, so the type PairModel k is not empty and no statement is true only because it has no model.
    - name: MinimalModel.pointPair_isKlt
      kind: theorem
      status: proved
      note: Check F2. The pair (Spec k, 0) is klt, so the class of klt pairs is not empty. Spec k has no divisorial valuation.
    - name: MinimalModel.pointPair_isDlt
      kind: theorem
      status: proved
      note: Check F2. The pair (Spec k, 0) is dlt, so the class of dlt pairs is not empty.
    - name: MinimalModel.pointPair_isTerminal
      kind: theorem
      status: proved
      note: Check F2. The pair (Spec k, 0) is terminal, so the class of terminal pairs is not empty.
    - name: MinimalModel.pointModel_coneDecomposition
      kind: theorem
      status: proved
      note: Check F2 for S04. The hypotheses of the cone theorem hold for (Spec k, 0), and its conclusion holds with no rays.
    - name: MinimalModel.pointModel_terminates
      kind: theorem
      status: proved
      note: Check F2 for S20 and S22. The model (Spec k, 0) is lc with a rational boundary, and it has no infinite program.
    - name: MinimalModel.Toric.isPrimitive_primitivePart
      kind: theorem
      status: proved
      note: Route R3. The primitive part of a nonzero lattice point is primitive, and latticeCone_primitivePart shows that it spans the same ray (CLS11 Section 1.2).
    - name: MinimalModel.Toric.IsPrimitive.toNR_mem_latticeCone_iff
      kind: theorem
      status: proved
      note: Route R3. The lattice points of the ray of a primitive point u are the points k u with k a natural number.
    - name: MinimalModel.Toric.IsRay.rayGenerator_spec
      kind: theorem
      status: proved
      note: Route R3. The primitive generator u of a ray is primitive and spans the ray (CLS11 Section 3.1).
    - name: MinimalModel.Toric.IsRay.toNR_mem_iff
      kind: theorem
      status: proved
      note: Route R3. The lattice points of a ray are the multiples k u of its primitive generator, so u generates the semigroup of lattice points of the ray.
    - name: MinimalModel.Toric.IsRay.eq_rayGenerator
      kind: theorem
      status: proved
      note: Route R3. The primitive generator of a ray is unique. A primitive lattice point of the ray is the primitive generator.
    - name: MinimalModel.Toric.Fan.isQCartier_iff
      kind: theorem
      status: proved
      note: Route R3. A torus-invariant divisor is Q-Cartier when it has the data m in the rational dual lattice on each cone, with the value minus a at the primitive generator of each ray of the cone (CLS11 Theorem 4.2.8).
    - name: MinimalModel.Toric.Fan.IsQCartier.isRCartier
      kind: theorem
      status: proved
      note: Route R3. A Q-Cartier divisor satisfies the criterion of CLS11 Theorem 4.2.8 over the reals.
    - name: MinimalModel.Toric.Fan.IsSupportFunctionOf.isRCartier
      kind: theorem
      status: proved
      note: Route R3. A divisor with a support function satisfies the criterion of CLS11 Theorem 4.2.8 over the reals. The converse is `isRCartier_iff_exists_isSupportFunctionOf`.
    - name: MinimalModel.Toric.P2.isComplete
      kind: theorem
      status: proved
      note: Check F2. The fan of the projective plane, with the rays e1, e2 and -e1-e2 and three 2-cones, is a fan and it is complete.
    - name: MinimalModel.Toric.P2.isSimplicialFan
      kind: theorem
      status: proved
      note: Check F2. The fan of the projective plane is simplicial.
    - name: MinimalModel.Toric.P2.coeffSum_canonical
      kind: theorem
      status: proved
      note: Check F2. The fan of the projective plane has three rays, and the sum of the coefficients of its canonical divisor is -3.
    - name: MinimalModel.Toric.P2.isCartier_canonical
      kind: theorem
      status: proved
      note: Check F2. The canonical divisor of the projective plane is Cartier, so the classes of Cartier and Q-Cartier divisors are not empty.
    - name: MinimalModel.Toric.P2.wall_relation
      kind: theorem
      status: proved
      note: Route R3. The wall relation of the fan of the projective plane. The sum of the three primitive generators is zero (CLS11 Section 6.4).
    - name: MinimalModel.Toric.exists_subset_isFaceOf_rays
      kind: theorem
      status: proved
      note: Route R3. A strongly convex cone spanned by finitely many lattice points is spanned by a subset of them, each of which spans a ray that is a face of the cone (CLS11 Section 1.2).
    - name: MinimalModel.Toric.eq_hull_rayGenerator
      kind: theorem
      status: proved
      note: Route R3. A strongly convex rational polyhedral cone is the cone spanned by the primitive generators of its rays (CLS11 Section 1.2).
    - name: MinimalModel.Toric.Fan.eq_hull_generator
      kind: theorem
      status: proved
      note: Route R3. Each cone of a fan is spanned by the primitive generators of the rays of the fan that lie in it.
    - name: MinimalModel.Toric.Fan.IsRCartier.exists_isSupportFunctionOf
      kind: theorem
      status: proved
      note: Route R3. An R-Cartier divisor on a fan has a support function (CLS11 Theorem 4.2.12).
    - name: MinimalModel.Toric.Fan.IsSupportFunctionOf.eqOn_support
      kind: theorem
      status: proved
      note: Route R3. The support function of a divisor is unique on the support of the fan (CLS11 Theorem 4.2.12).
    - name: MinimalModel.Toric.Fan.isRCartier_iff_exists_isSupportFunctionOf
      kind: theorem
      status: proved
      note: Route R3. A divisor on a fan is R-Cartier if and only if it has a support function (CLS11 Theorem 4.2.12).
    - name: MinimalModel.Toric.IsLatticeBasis.repr_nonneg
      kind: theorem
      status: proved
      note: Route R3. The coordinates of a lattice point of a smooth cone in the basis of its generators are nonnegative.
    - name: MinimalModel.Toric.Fan.exists_unique_wall_relation
      kind: theorem
      status: proved
      note: Route R3. Two smooth cones of a fan that share all generators but one satisfy the wall relation with unique integer coefficients (CLS11 Section 6.4).
    - name: MinimalModel.Toric.P2.existsUnique_wall_c12_c20
      kind: theorem
      status: proved
      note: Route R3. The general wall relation applies to two adjacent cones of the fan of the projective plane. This is a check F2 instance.
    - name: MinimalModel.Toric.Fan.WallData.degree
      kind: def
      status: proved
      note: Route R3. The degree of a divisor on the curve of a wall, read off the fan. For smooth cones it is D·V(τ) of CLS11 Proposition 6.4.4.
    - name: MinimalModel.Toric.Fan.WallData.degree_eq
      kind: theorem
      status: proved
      note: Route R3. The degree on a wall is a_ρ' + m_σ(u_ρ') with the convention m_σ(u_ρ) = -a_ρ (CLS11 Proposition 6.4.4).
    - name: MinimalModel.Toric.Fan.WallData.degree_nonneg_iff
      kind: theorem
      status: proved
      note: Route R3. The degree on a wall is nonnegative exactly when the support function satisfies the wall inequality (CLS11 Sections 6.3 and 6.4).
    - name: MinimalModel.Toric.P2.degree_primeDivisor_c12_c20
      kind: theorem
      status: proved
      note: Route R3. Each prime divisor of the projective plane has degree 1 on each of the three walls. This is a check F2 instance.
    - name: MinimalModel.Toric.P2.isNef_neg_canonical
      kind: theorem
      status: proved
      note: Route R3. The anticanonical divisor of the projective plane is nef. This is a check F2 instance.
    - name: MinimalModel.Toric.IsSimplicial.isClosed
      kind: theorem
      status: proved
      note: Route R3. A simplicial cone is closed, as the image of the nonnegative orthant under an injective linear map.
    - name: MinimalModel.Toric.Fan.concaveOn_iff_forall_isConvexAcross
      kind: theorem
      status: proved
      note: Route R3. On a complete fan with closed cones, a support function is convex exactly when it satisfies the wall inequality at each wall. The proof is the generic segment argument.
    - name: MinimalModel.Toric.Fan.concaveOn_iff_forall_isConvexAcross_of_isSimplicialFan
      kind: theorem
      status: proved
      note: Route R3. The same for a complete simplicial fan.
    - name: MinimalModel.Toric.Fan.IsWallPair.nonempty_wallData
      kind: theorem
      status: proved
      note: Route R3. Two simplicial maximal cones that meet in a wall carry the data of a wall.
    - name: MinimalModel.Toric.Fan.coneTheorem
      kind: theorem
      status: proved
      note: Route R3, S2 in combinatorial form. On a complete simplicial fan, an R-Cartier divisor is nef exactly when its degree on each wall curve is nonnegative (CLS11 Theorem 6.3.12 and Proposition 6.4.4). The geometric form needs the toric variety as a scheme, which is not in the repository yet.
    - name: MinimalModel.Toric.ToricConeTheorem
      kind: statement
      status: known
      note: The pinned statement of the toric cone theorem in combinatorial form, in MinimalModel/Statements/Toric.lean (CLS11 Theorem 6.3.12 and Proposition 6.4.4, Rei83). Row Q4 of spec 14 compares toricConeTheorem with it.
    - name: MinimalModel.Toric.toricConeTheorem
      kind: theorem
      status: proved
      note: Route R3, S2. The toric cone theorem in the form of the pinned statement ToricConeTheorem, from Fan.coneTheorem. The job comparator of the workflow trust checks it against Comparator/Challenge.lean.
    - name: MinimalModel.Toric.Circuit.fan
      kind: def
      status: proved
      note: Route R3, step 5 (toric flips, part 1). The fan of a circuit of lattice points with the relation a, of the cones that miss an index of J+ (Rei83 Section 2). The flip of this local model is the fan Circuit.neg.fan of the opposite relation.
    - name: MinimalModel.Toric.IsCircuit.exists_mem_indexCone_compl
      kind: theorem
      status: proved
      note: Route R3, step 5. The cones of a circuit that miss one index of J+ cover the cone of the whole circuit.
    - name: MinimalModel.Toric.IsCircuit.indexCone_inf
      kind: theorem
      status: proved
      note: Route R3, step 5. Two cones of a circuit that each miss an index of J+ meet in the cone of the common indices.
    - name: MinimalModel.Toric.Circuit.isSimplicialFan_fan
      kind: theorem
      status: proved
      note: Route R3, step 5. The fan of a circuit is simplicial, and so is its flip (isSimplicialFan_neg_fan).
    - name: MinimalModel.Toric.Circuit.support_neg_fan
      kind: theorem
      status: proved
      note: Route R3, step 5. When J+ and J- are not empty, the fan of a circuit and its flip have the same support, the cone of the circuit (support_fan).
    - name: MinimalModel.IsPlt
      kind: def
      status: proved
      note: The class of purely log terminal pairs, KM98 Definition 2.34. The coefficients of the boundary are at most one, and each exceptional divisorial valuation has a positive log discrepancy.
    - name: MinimalModel.Pair.HasDivisorLogDiscrepancy
      kind: def
      status: proved
      note: A hypothesis. Each divisorial valuation that is not exceptional has the log discrepancy 1 - Δ Q for a prime divisor Q. It holds for every pair, and Pair.hasDivisorLogDiscrepancy proves it.
    - name: MinimalModel.IsKlt.isPlt
      kind: theorem
      status: proved
      note: Check F3. A klt pair is plt.
    - name: MinimalModel.IsKlt.isDlt
      kind: theorem
      status: proved
      note: Check F3. A klt pair is dlt, with the closed set Z equal to X.
    - name: MinimalModel.IsDlt.isLc
      kind: theorem
      status: proved
      note: Check F3. A dlt pair is lc.
    - name: MinimalModel.IsCanonical.isPlt
      kind: theorem
      status: proved
      note: Check F3. A canonical pair with coefficients at most one is plt.
    - name: MinimalModel.IsTerminal.isPlt
      kind: theorem
      status: proved
      note: Check F3. A terminal pair with coefficients at most one is plt.
    - name: MinimalModel.IsPlt.isKlt
      kind: theorem
      status: proved
      note: Check F3. A plt pair with coefficients less than one is klt, with the hypothesis Pair.HasDivisorLogDiscrepancy.
    - name: MinimalModel.IsCanonical.isKlt
      kind: theorem
      status: proved
      note: Check F3. A canonical pair with coefficients less than one is klt, with the hypothesis Pair.HasDivisorLogDiscrepancy.
    - name: MinimalModel.IsTerminal.isKlt
      kind: theorem
      status: proved
      note: Check F3. A terminal pair with coefficients less than one is klt, with the hypothesis Pair.HasDivisorLogDiscrepancy.
    - name: MinimalModel.IsPlt.isLc
      kind: theorem
      status: proved
      note: Check F3. A plt pair is lc, with the hypothesis Pair.HasDivisorLogDiscrepancy.
    - name: MinimalModel.IsPlt.isDlt
      kind: theorem
      status: proved
      note: Check F3. A plt pair is dlt when it is lc and a closed set Z is given, such that the pair is snc outside Z and each divisorial valuation with centre in Z is exceptional.
    - name: MinimalModel.not_isPlt_of_one_lt
      kind: theorem
      status: proved
      note: Check F3. A pair with a coefficient more than one is not plt.
    - name: MinimalModel.pointPair_isPlt
      kind: theorem
      status: proved
      note: Check F2. The pair (Spec k, 0) is plt, so the class of plt pairs is not empty.
    - name: MinimalModel.affineLinePair_two_not_isPlt
      kind: theorem
      status: proved
      note: Check F3. The pair (A1, 2[0]) is not plt.
    - name: MinimalModel.affineLinePair_two_not_isKlt
      kind: theorem
      status: proved
      note: Check F3. The pair (A1, 2[0]) is not klt.
    - name: MinimalModel.affineLinePair_two_not_isDlt
      kind: theorem
      status: proved
      note: Check F3. The pair (A1, 2[0]) is not dlt.
    - name: MinimalModel.IsCentre.eq
      kind: theorem
      status: proved
      note: A valuation of the function field has at most one centre on X. The proof uses the valuative criterion for the separated morphism to Spec k.
    - name: MinimalModel.IsCentre.valuation_eq_exp
      kind: theorem
      status: proved
      note: When a prime divisor Q is a centre of a valuation that takes the value exp(-1), the valuation is the order along Q.
    - name: MinimalModel.IsCentre.formOrd_eq
      kind: theorem
      status: proved
      note: The order of the form of a divisor D along such a valuation is the coefficient of D at Q.
    - name: MinimalModel.Pair.hasDivisorLogDiscrepancy
      kind: theorem
      status: proved
      note: Each divisorial valuation that is not exceptional has the log discrepancy 1 - Δ Q for a prime divisor Q. This proves the hypothesis Pair.HasDivisorLogDiscrepancy for every pair.
    - name: MinimalModel.IsPlt.isKlt'
      kind: theorem
      status: proved
      note: Check F3. A plt pair with coefficients less than one is klt, with no hypothesis.
    - name: MinimalModel.IsCanonical.isKlt'
      kind: theorem
      status: proved
      note: Check F3. A canonical pair with coefficients less than one is klt, with no hypothesis.
    - name: MinimalModel.IsTerminal.isKlt'
      kind: theorem
      status: proved
      note: Check F3. A terminal pair with coefficients less than one is klt, with no hypothesis.
    - name: MinimalModel.IsPlt.isLc'
      kind: theorem
      status: proved
      note: Check F3. A plt pair is lc, with no hypothesis.
    - name: MinimalModel.IsCentre.coheight_eq_one_of_dim_eq_one
      kind: theorem
      status: proved
      note: On a variety of dimension one, a centre of a divisorial valuation has coheight one.
    - name: MinimalModel.isKlt_of_dim_eq_one
      kind: theorem
      status: proved
      note: On a variety of dimension one, a pair with coefficients less than one is klt. The theorems isLc_of_dim_eq_one, isPlt_of_dim_eq_one, isTerminal_of_dim_eq_one, isCanonical_of_dim_eq_one and isDlt_of_dim_eq_one give the other classes.
    - name: MinimalModel.affineLinePair_zero_isKlt
      kind: theorem
      status: proved
      note: Check F2. The pair (A1, 0) is klt. The theorems affineLinePair_zero_isLc, _isPlt, _isDlt, _isTerminal and _isCanonical give the other classes.
    - name: MinimalModel.affineLinePair_isKlt
      kind: theorem
      status: proved
      note: Check F3. The pair (A1, c[0]) is klt and dlt for c < 1 (affineLinePair_isDlt).
    - name: MinimalModel.affineLinePair_isLc
      kind: theorem
      status: proved
      note: Check F3. The pair (A1, c[0]) is lc and plt for c ≤ 1 (affineLinePair_isPlt). It is terminal and canonical for each c.
    - name: MinimalModel.pointVariety_kleiman
      kind: theorem
      status: proved
      note: Check F2 for S01. The point is projective, and both sides of Kleiman's criterion hold on it.
    - name: MinimalModel.isEmpty_extremalRay
      kind: theorem
      status: proved
      note: Check F3 for S09. A variety with no curves has no extremal ray.
    - name: MinimalModel.not_isEnc_of_dim_eq_one
      kind: theorem
      status: proved
      note: Check F3 for S52. No pair on a variety of dimension one is enc. The theorems pointPair_not_isEnc and affineLinePair_not_isEnc give the point and the affine line, and pointPair_globalMld gives the global mld 0 of (Spec k, 0).
    - name: MinimalModel.pointVariety_sections_ne_bot
      kind: theorem
      status: proved
      note: Check F3 for S57. Each divisor on the point has a nonzero section, so the point is no counterexample to effective non-vanishing.
    - name: MinimalModel.ShokurovLemma
      kind: statement
      status: known
      note: The pinned statement of the abstract Shokurov lemma (Sho04), route item O-R4-1, in MinimalModel/Statements/Shokurov.lean. Row Q4 of spec 14 compares shokurovLemma with it.
    - name: MinimalModel.shokurovLemma
      kind: theorem
      status: proved
      note: Route item O-R4-1, milestone S3. The abstract Shokurov lemma in the form of the pinned statement ShokurovLemma, from not_exists_chain_of_lsc. The job comparator of the workflow trust checks it against Comparator/Challenge.lean.
    - name: MinimalModel.not_exists_chain_of_lsc
      kind: theorem
      status: proved
      note: The abstract Shokurov lemma (Sho04), in MinimalModel/Reductions/Shokurov.lean. Over an axiomatic flip sequence, a lower semicontinuous local invariant on a compact nonempty locus of each state, with values in an ACC set, that strictly improves at each step, gives termination. The lemma has no geometry, and it uses only Mathlib.
    - name: MinimalModel.shokurovLemma_pi
      kind: theorem
      status: proved
      note: The abstract Shokurov lemma for a finite tuple of invariants, each in its own ACC set, that strictly increases in the product order. The proof is Dickson's lemma, Set.PartiallyWellOrderedOn.pi.
    - name: MinimalModel.not_exists_chain_of_acc
      kind: theorem
      status: proved
      note: An invariant with values in an ACC set that strictly increases at each step gives termination. The lemmas not_exists_chain_of_lsc and shokurovLemma_pi reduce to it.
