name: trust

# Replay each declaration of the package in the Lean kernel, in a fresh environment, with leanchecker of the toolchain. The replay covers the imports too, Mathlib included. leanchecker uses the kernel of Lean itself, so it finds an environment that a tactic or a metaprogram has changed, but it is not an independent kernel.
#
# The job lean4lean checks each declaration of the package MinimalModel again with lean4lean, a type checker for Lean written in Lean. The program scripts/L4LPackage.lean loads the external imports of the package one time and gives all the declarations of the package to the replay of lean4lean. It takes the declarations of Mathlib as correct, so it does not check Mathlib again. The command `lean4lean MinimalModel` loads one environment for each module in parallel, and for more than a thousand modules the runner does not have sufficient memory. lean4lean follows the design of the C++ kernel, so it is a second implementation but not an independent design. This is check Q3 of spec 14.
#
# The job comparator runs `lake comparator --paranoid` with comparator.json. When comparator.json has no theorem, the job skips the comparison. It checks that each proved top theorem has exactly the type of its pinned statement in Comparator/Challenge.lean and uses only the permitted axioms. With --paranoid it also runs the external checkers that come with Lean. This is check Q4 of spec 14, and a second part of check Q3.
#
# The job nanoda exports the declarations of the package MinimalModel with leanexport, together with all the declarations that they use, Mathlib included. nanoda, a type checker for Lean written in Rust, then checks the export. nanoda is built from a pinned commit of ammkrn/nanoda_lib. This is also check Q3.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: leanchecker --fresh MinimalModel
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build
      - name: replay
        run: |
          start=$(date +%s)
          lake env leanchecker --fresh MinimalModel
          echo "the replay took $(( $(date +%s) - start )) s"

  lean4lean:
    name: lean4lean on the modules of MinimalModel
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # The last commit of lean4lean on the toolchain v4.35.0 of this package.
      LEAN4LEAN_REV: b3ad4b39d94526395d2f39682208c7bd6fb0c1f3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build
      - name: build lean4lean
        run: |
          git clone -q https://github.com/digama0/lean4lean "$RUNNER_TEMP/lean4lean"
          git -C "$RUNNER_TEMP/lean4lean" checkout -q "$LEAN4LEAN_REV"
          cp scripts/L4LPackage.lean "$RUNNER_TEMP/lean4lean/"
          printf '\n[[lean_exe]]\nname = "l4lpackage"\nroot = "L4LPackage"\nsupportInterpreter = true\n' >> "$RUNNER_TEMP/lean4lean/lakefile.toml"
          cd "$RUNNER_TEMP/lean4lean"
          lake build l4lpackage
      - name: check
        run: |
          start=$(date +%s)
          lake env "$RUNNER_TEMP/lean4lean/.lake/build/bin/l4lpackage" MinimalModel
          echo "the check took $(( $(date +%s) - start )) s"

  nanoda:
    name: nanoda on the export of MinimalModel
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # The head of the branch master of ammkrn/nanoda_lib on 2026-11-24, a merge of 2026-11-07. The toolchain v4.35.0 bundles the older commit 3a2407216ee84a75f9e1aead6803d0578be06ae7.
      NANODA_REV: 0da9f98feadd3a0a2ef4b3dbcf52a298a6fef929
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build
      - name: build nanoda
        run: |
          git clone -q https://github.com/ammkrn/nanoda_lib "$RUNNER_TEMP/nanoda_lib"
          git -C "$RUNNER_TEMP/nanoda_lib" checkout -q "$NANODA_REV"
          cd "$RUNNER_TEMP/nanoda_lib"
          cargo build --release --locked
      - name: export
        run: |
          start=$(date +%s)
          lake env lean --run scripts/Decls.lean MinimalModel > "$RUNNER_TEMP/decls.txt"
          mapfile -t decls < "$RUNNER_TEMP/decls.txt"
          lake env leanexport MinimalModel -- "${decls[@]}" > "$RUNNER_TEMP/export.ndjson"
          echo "the export has $(wc -l < "$RUNNER_TEMP/export.ndjson") lines and $(du -h "$RUNNER_TEMP/export.ndjson" | cut -f1)"
          echo "the export took $(( $(date +%s) - start )) s"
      - name: check
        run: |
          cat > "$RUNNER_TEMP/nanoda.json" <<EOF
          {
            "export_file_path": "$RUNNER_TEMP/export.ndjson",
            "use_stdin": false,
            "num_threads": 4,
            "permitted_axioms": ["propext", "Classical.choice", "Quot.sound"],
            "unpermitted_axiom_hard_error": true,
            "nat_extension": true,
            "string_extension": true,
            "print_axioms": true,
            "pp_to_stdout": true,
            "print_success_message": true
          }
          EOF
          start=$(date +%s)
          "$RUNNER_TEMP/nanoda_lib/target/release/nanoda_bin" "$RUNNER_TEMP/nanoda.json"
          echo "the check took $(( $(date +%s) - start )) s"

  comparator:
    name: lake comparator --paranoid
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces with AppArmor, and bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build MinimalModel Comparator
      - name: compare
        run: |
          if [ "$(jq '.theorem_names | length' comparator.json)" -eq 0 ]; then
            echo "comparator.json has no proved top theorem, so the comparison is skipped"
            exit 0
          fi
          start=$(date +%s)
          lake comparator --config comparator.json --paranoid
          echo "the comparison took $(( $(date +%s) - start )) s"
